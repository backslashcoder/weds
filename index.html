<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Promise Begins — September 20, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0710;
    --bg-deep-2:#150a13;
    --wine:#4a1227;
    --wine-soft:#3a0f20;
    --burgundy:#7a2740;
    --gold:#c9a15a;
    --gold-bright:#e9cf9c;
    --gold-dim:#8a713f;
    --warm-white:#f4ead9;
    --ink-soft:rgba(244,234,217,0.62);
    --ink-faint:rgba(244,234,217,0.38);
    --card-line: rgba(201,161,90,0.35);
    --ease-lux: cubic-bezier(.22,.9,.28,1);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    overflow-x:hidden;
  }
  body{
    font-family:'Jost', sans-serif;
    color:var(--warm-white);
    min-height:100svh;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- background layers ---------- */
  .bg-gradient{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 12%, rgba(74,18,39,0.55), transparent 60%),
      radial-gradient(ellipse 70% 50% at 15% 90%, rgba(122,39,64,0.30), transparent 65%),
      radial-gradient(ellipse 70% 50% at 88% 85%, rgba(74,18,39,0.28), transparent 65%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, #0c0810 100%);
    animation: bgShift 26s ease-in-out infinite alternate;
  }
  @keyframes bgShift{
    0%{ filter:brightness(1) saturate(1); }
    100%{ filter:brightness(1.06) saturate(1.12); }
  }

  canvas#scene{
    position:fixed; inset:0; z-index:1; width:100%; height:100%; pointer-events:none;
  }

  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse 120% 90% at 50% 50%, transparent 40%, rgba(6,4,8,0.55) 100%);
  }

  /* ---------- ornamental corners ---------- */
  .motif{
    position:fixed; z-index:2; width:min(30vw,220px); height:min(30vw,220px);
    opacity:0; pointer-events:none;
    transition: opacity 1.8s var(--ease-lux);
  }
  body.ready .motif{ opacity:0.35; }
  .motif svg{ width:100%; height:100%; }
  .motif path, .motif circle, .motif ellipse{
    stroke:var(--gold); fill:none; stroke-width:0.6;
  }
  .motif.tl{ top:-2%; left:-2%; }
  .motif.br{ bottom:-2%; right:-2%; transform:rotate(180deg); }
  @media (max-width:640px){ .motif{ width:34vw; height:34vw; opacity:0 !important; } }

  /* ---------- layout ---------- */
  main{
    position:relative; z-index:3;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 8vh 6vw 6vh;
    text-align:center;
  }

  .event-tabs{
    display:flex; align-items:center; justify-content:center;
    gap:0.2rem;
    width:max-content; max-width:100%;
    padding:0.28rem;
    margin:0 auto clamp(1.4rem, 3.6vw, 2.2rem);
    border-radius:999px;
    border:1px solid var(--card-line);
    background:rgba(244,234,217,0.04);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity:0; transform:translateY(12px);
    transition: opacity 1.1s var(--ease-lux), transform 1.1s var(--ease-lux);
  }
  body.ready .event-tabs{ opacity:1; transform:translateY(0); transition-delay:.28s; }
  .event-tab{
    appearance:none; border:0; cursor:pointer;
    font-family:'Jost', sans-serif; font-weight:400;
    font-size: clamp(0.68rem, 1.2vw, 0.8rem);
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink-soft);
    background:transparent;
    padding: 0.62rem 1.15rem;
    border-radius:999px;
    transition: color .35s ease, background .35s ease, box-shadow .35s ease;
  }
  .event-tab:hover{ color:var(--gold-bright); }
  .event-tab.active{
    color:var(--bg-deep);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow: 0 8px 22px -12px rgba(201,161,90,0.8);
  }

  .eyebrow{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400;
    font-size: clamp(1.05rem, 2.1vw, 1.6rem);
    color:var(--gold-bright);
    letter-spacing:0.02em;
    opacity:0; transform:translateY(14px);
    transition: opacity 1.1s var(--ease-lux), transform 1.1s var(--ease-lux);
    margin:0 0 clamp(1.6rem, 4vw, 2.6rem);
  }
  body.ready .eyebrow{ opacity:1; transform:translateY(0); transition-delay:.55s; }

  .event-panel{ display:none; width:100%; }
  .event-panel.active{ display:block; }
  .event-panel[hidden]{ display:none !important; }

  /* ---------- countdown ---------- */
  .countdown{
    position:relative;
    display:flex; align-items:stretch; justify-content:center;
    gap: clamp(0.7rem, 2vw, 1.6rem);
    flex-wrap:wrap;
  }
  .unit{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:clamp(4.6rem, 12vw, 7.4rem);
    padding: clamp(1rem,2.4vw,1.7rem) 0.4rem clamp(0.8rem,2vw,1.3rem);
    border-radius:14px;
    background:linear-gradient(160deg, rgba(244,234,217,0.05), rgba(244,234,217,0.015));
    border:1px solid var(--card-line);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 18px 40px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    opacity:0; transform:translateY(24px) scale(0.97);
    transition: opacity .9s var(--ease-lux), transform .9s var(--ease-lux), border-color .4s ease, box-shadow .4s ease;
  }
  body.ready .unit{ opacity:1; transform:translateY(0) scale(1); }
  body.ready .unit:nth-child(1){ transition-delay:.85s; }
  body.ready .unit:nth-child(2){ transition-delay:1.0s; }
  body.ready .unit:nth-child(3){ transition-delay:1.15s; }
  body.ready .unit:nth-child(4){ transition-delay:1.3s; }

  .unit:hover{
    transform:translateY(0) scale(1.02);
    border-color: rgba(233,207,156,0.75);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 22px 46px -18px rgba(0,0,0,0.65), 0 0 26px -6px rgba(201,161,90,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .unit-sweep{
    position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none;
  }
  .unit-sweep::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(233,207,156,0.16), transparent);
    transform:skewX(-18deg);
    transition:left .9s ease;
  }
  .unit:hover .unit-sweep::after{ left:130%; }

  .digits{
    display:flex; font-family:'Fraunces', serif; font-weight:450;
    font-size: clamp(2.1rem, 6vw, 3.6rem);
    line-height:1;
    color:var(--warm-white);
    text-shadow: 0 0 18px rgba(233,207,156,0.28);
    font-variant-numeric: tabular-nums;
  }
  .digit-slot{
    position:relative; display:inline-block;
    overflow:hidden;
    height:1em; width:0.66em;
    clip-path: inset(0);
    -webkit-clip-path: inset(0);
  }
  .digit{
    position:absolute; left:0; right:0; top:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    transition: transform .42s var(--ease-lux), opacity .32s ease;
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  .digit.next{ transform:translate3d(0,100%,0); opacity:0; }
  .digit.next.in{ transform:translate3d(0,0,0); opacity:1; }
  .digit.cur.out{ transform:translate3d(0,-100%,0); opacity:0; }

  .days-value{
    font-family:'Fraunces', serif; font-weight:450;
    font-size: clamp(2.1rem, 6vw, 3.6rem); line-height:1;
    color:var(--warm-white); text-shadow: 0 0 18px rgba(233,207,156,0.28);
    transition: opacity .4s ease, transform .4s ease;
    font-variant-numeric: tabular-nums;
  }
  .days-value.swap{ opacity:0; transform:translateY(-8px) scale(0.96); }

  .unit-label{
    margin-top: clamp(0.5rem, 1.4vw, 0.85rem);
    font-family:'Jost', sans-serif; font-weight:400;
    font-size: clamp(0.62rem, 1.15vw, 0.78rem);
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .colon{
    align-self:center;
    font-family:'Fraunces', serif; font-weight:300;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    color: var(--gold-dim);
    opacity:0; transform:translateY(24px);
    transition: opacity .9s var(--ease-lux), transform .9s var(--ease-lux);
    padding-top: clamp(0.7rem,1.8vw,1.1rem);
  }
  body.ready .colon{ opacity:.7; transform:translateY(0); transition-delay:1.05s; }
  @media (max-width:560px){ .colon{ display:none; } }

  /* ---------- motif divider ---------- */
  .divider{
    margin: clamp(2.2rem,5vw,3.4rem) 0 clamp(1.4rem,3.4vw,2.2rem);
    width: 72px; height:34px;
    opacity:0; transform:translateY(10px) scale(0.9);
    transition: opacity 1.1s var(--ease-lux), transform 1.1s var(--ease-lux);
  }
  body.ready .divider{ opacity:1; transform:translateY(0) scale(1); transition-delay:1.6s; }
  .divider svg{ width:100%; height:100%; overflow:visible; }
  .divider path{
    fill:none; stroke:var(--gold); stroke-width:1; stroke-linecap:round;
    stroke-dasharray: 140; stroke-dashoffset:140;
    animation: draw 2.4s var(--ease-lux) forwards;
    animation-delay:1.7s;
  }
  body.reduced-motion .divider path{ animation:none; stroke-dashoffset:0; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .divider circle{ fill:var(--gold-bright); opacity:0; animation: dividerGlow 3.6s ease-in-out infinite; animation-delay:2.4s; }
  @keyframes dividerGlow{ 0%,100%{opacity:.35;} 50%{opacity:1;} }

  /* ---------- date block ---------- */
  .date-block{
    opacity:0; transform:translateY(14px);
    transition: opacity 1s var(--ease-lux), transform 1s var(--ease-lux);
  }
  body.ready .date-block{ opacity:1; transform:translateY(0); transition-delay:1.85s; }
  .date-main{
    font-family:'Fraunces', serif; font-weight:500; font-style:normal;
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    letter-spacing:0.03em;
    color:var(--gold-bright);
    margin:0 0 0.5rem;
  }
  .date-sub{
    font-family:'Jost', sans-serif; font-weight:300;
    font-size: clamp(0.85rem, 1.3vw, 0.98rem);
    letter-spacing:0.14em;
    color: var(--ink-soft);
    margin:0;
  }

  /* ---------- footer ---------- */
  footer{
    position:relative; z-index:3;
    text-align:center; padding: 0 6vw clamp(2.2rem,5vw,3rem);
    opacity:0; transition: opacity 1.2s var(--ease-lux);
  }
  body.ready footer{ opacity:1; transition-delay:2.2s; }
  footer p{
    margin:0;
    font-family:'Fraunces', serif; font-style:italic; font-weight:400;
    font-size: clamp(0.85rem, 1.3vw, 1rem);
    color: var(--ink-faint);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ---------- music toggle ---------- */
  .music-btn{
    position:fixed; z-index:5; right: clamp(1rem,3vw,1.8rem); bottom: clamp(1rem,3vw,1.8rem);
    width:46px; height:46px; border-radius:50%;
    border:1px solid var(--card-line);
    background:rgba(20,12,18,0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:1.05rem;
    opacity:0; transform:scale(0.85);
    transition: opacity 1s var(--ease-lux), transform .3s var(--ease-lux), border-color .3s ease, box-shadow .3s ease;
  }
  body.ready .music-btn{ opacity:1; transform:scale(1); transition-delay:2.4s; }
  .music-btn:hover{ border-color:var(--gold-bright); box-shadow:0 0 22px -6px rgba(201,161,90,0.5); }
  .music-btn:active{ transform:scale(0.94); }

  /* ---------- celebration burst ---------- */
  .light-burst{
    position:fixed; z-index:2; left:50%; top:38%;
    width:10px; height:10px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(233,207,156,0.9), rgba(233,207,156,0) 70%);
    opacity:0; pointer-events:none;
  }
  .light-burst.pulse{ animation:burstPulse 2.6s ease-out; }
  @keyframes burstPulse{
    0%{ opacity:0; width:10px; height:10px; }
    18%{ opacity:.55; width:520px; height:520px; }
    100%{ opacity:0; width:760px; height:760px; }
  }

  /* ---------- arrival state ---------- */
  .arrival{
    display:none; flex-direction:column; align-items:center;
    opacity:0; transform:translateY(18px) scale(0.97);
    transition: opacity 1.1s var(--ease-lux), transform 1.1s var(--ease-lux);
  }
  .arrival.show{ display:flex; opacity:1; transform:translateY(0) scale(1); }
  .arrival-heart{
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    color:var(--gold-bright);
    margin-bottom: 1.2rem;
    animation: heartbeat 2.4s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(233,207,156,0.45);
  }
  @keyframes heartbeat{ 0%,100%{ transform:scale(1); } 22%{ transform:scale(1.14); } 40%{ transform:scale(1); } 58%{ transform:scale(1.08); } 74%{ transform:scale(1); } }
  .arrival-title{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size: clamp(2.1rem, 5vw, 3.2rem);
    color: var(--warm-white);
    margin:0;
  }
  .countdown-wrap.fading .countdown,
  .countdown-wrap.fading .colon{ opacity:0; transform:translateY(-10px); transition: opacity .8s ease, transform .8s ease; }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.2s !important; }
    .bg-gradient{ animation:none; }
    footer p{ animation:none; opacity:.8; }
    .arrival-heart{ animation:none; }
  }

  @media (max-width:520px){
    .digits, .days-value{ font-size: clamp(1.7rem, 9vw, 2.4rem); }
    .unit{ width: 22vw; min-width:70px; padding:0.9rem 0.2rem 0.7rem; }
    .countdown{ gap:0.5rem; }
    .event-tab{ padding: 0.55rem 0.85rem; letter-spacing: 0.12em; }
  }
</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div class="light-burst" id="lightBurst"></div>

  <div class="motif tl" aria-hidden="true">
    <svg viewBox="0 0 200 200"><path d="M4,4 C60,4 4,60 4,110 C4,160 60,196 110,196 M4,4 C4,60 60,4 110,4 C160,4 196,60 196,110"/><circle cx="4" cy="4" r="4"/></svg>
  </div>
  <div class="motif br" aria-hidden="true">
    <svg viewBox="0 0 200 200"><path d="M4,4 C60,4 4,60 4,110 C4,160 60,196 110,196 M4,4 C4,60 60,4 110,4 C160,4 196,60 196,110"/><circle cx="4" cy="4" r="4"/></svg>
  </div>

  <main>
    <div class="event-tabs" role="tablist" aria-label="Choose an occasion">
      <button class="event-tab active" role="tab" id="tab-engagement" aria-selected="true" aria-controls="panel-engagement" data-event="engagement">Engagement</button>
      <button class="event-tab" role="tab" id="tab-marriage" aria-selected="false" aria-controls="panel-marriage" data-event="marriage">Marriage</button>
    </div>

    <section class="event-panel active" id="panel-engagement" role="tabpanel" aria-labelledby="tab-engagement">
      <h1 class="eyebrow">Our Promise Begins In</h1>
      <div class="countdown-wrap" id="countdownWrap-engagement">
        <div class="countdown">
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="days-value" id="daysValue-engagement">0</div>
            <div class="unit-label">Days</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="hoursDigits-engagement"></div>
            <div class="unit-label">Hours</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="minutesDigits-engagement"></div>
            <div class="unit-label">Minutes</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="secondsDigits-engagement"></div>
            <div class="unit-label">Seconds</div>
          </div>
        </div>
        <div class="divider">
          <svg viewBox="0 0 72 34">
            <path d="M18,17 C18,9 26,9 26,17 C26,25 34,25 34,17 C34,9 42,9 42,17 C42,25 50,25 50,17 C50,9 58,9 58,17"/>
            <circle cx="36" cy="17" r="1.6"/>
          </svg>
        </div>
        <div class="date-block">
          <p class="date-main">September 20, 2026</p>
          <p class="date-sub">The Day We Promise Forever</p>
        </div>
      </div>
      <div class="arrival" id="arrival-engagement">
        <div class="arrival-heart">❤</div>
        <h2 class="arrival-title">Today We Promise</h2>
      </div>
    </section>

    <section class="event-panel" id="panel-marriage" role="tabpanel" aria-labelledby="tab-marriage" hidden>
      <h1 class="eyebrow">Our Forever Begins In</h1>
      <div class="countdown-wrap" id="countdownWrap-marriage">
        <div class="countdown">
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="days-value" id="daysValue-marriage">0</div>
            <div class="unit-label">Days</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="hoursDigits-marriage"></div>
            <div class="unit-label">Hours</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="minutesDigits-marriage"></div>
            <div class="unit-label">Minutes</div>
          </div>
          <div class="colon">·</div>
          <div class="unit">
            <div class="unit-sweep"></div>
            <div class="digits" id="secondsDigits-marriage"></div>
            <div class="unit-label">Seconds</div>
          </div>
        </div>
        <div class="divider">
          <svg viewBox="0 0 72 34">
            <path d="M18,17 C18,9 26,9 26,17 C26,25 34,25 34,17 C34,9 42,9 42,17 C42,25 50,25 50,17 C50,9 58,9 58,17"/>
            <circle cx="36" cy="17" r="1.6"/>
          </svg>
        </div>
        <div class="date-block">
          <p class="date-main">December 6, 2026</p>
          <p class="date-sub">The Day We Begin Forever</p>
        </div>
      </div>
      <div class="arrival" id="arrival-marriage">
        <div class="arrival-heart">❤</div>
        <h2 class="arrival-title">Today is the Day</h2>
      </div>
    </section>
  </main>

  <footer>
    <p id="footerLine">Counting every moment until we promise.</p>
  </footer>

  <button class="music-btn" id="musicBtn" aria-label="Toggle wedding ambience">🔇</button>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= Countdown ================= */
  var FLIP_MS = 440;

  function FlipUnit(el, digitCount){
    this.digitCount = digitCount;
    this.slots = [];
    for (var i = 0; i < digitCount; i++){
      var slot = document.createElement('span');
      slot.className = 'digit-slot';
      var cur = document.createElement('span');
      cur.className = 'digit cur';
      cur.textContent = '0';
      slot.appendChild(cur);
      el.appendChild(slot);
      this.slots.push({ slot: slot, cur: cur, value: '0', animating: false });
    }
  }
  FlipUnit.prototype.hardSetSlot = function(s, ch){
    var kids = s.slot.querySelectorAll('.digit');
    for (var i = 0; i < kids.length; i++){
      if (kids[i] !== s.cur && kids[i].parentNode) kids[i].parentNode.removeChild(kids[i]);
    }
    s.cur.className = 'digit cur';
    s.cur.textContent = ch;
    s.animating = false;
    s.value = ch;
  };
  FlipUnit.prototype.set = function(str, instant){
    str = String(str);
    while (str.length < this.digitCount) str = '0' + str;
    str = str.slice(-this.digitCount);
    for (var i = 0; i < str.length; i++){
      var ch = str[i];
      var s = this.slots[i];
      if (s.value !== ch || (instant && s.cur.textContent !== ch)){
        if (instant || reduceMotion){
          this.hardSetSlot(s, ch);
        } else {
          s.value = ch;
          this.flip(s, ch);
        }
      }
    }
  };
  FlipUnit.prototype.flip = function(s, ch){
    if (reduceMotion){
      this.hardSetSlot(s, ch);
      return;
    }
    if (s.animating){
      return;
    }
    s.animating = true;
    var next = document.createElement('span');
    next.className = 'digit next';
    next.textContent = ch;
    s.slot.appendChild(next);
    void next.offsetWidth;
    s.cur.classList.add('out');
    requestAnimationFrame(function(){ next.classList.add('in'); });
    var oldCur = s.cur;
    var self = this;
    setTimeout(function(){
      if (oldCur.parentNode) oldCur.parentNode.removeChild(oldCur);
      next.classList.remove('next', 'in');
      next.classList.add('cur');
      s.cur = next;
      s.animating = false;
      if (s.cur.textContent !== s.value){
        self.flip(s, s.value);
      }
    }, FLIP_MS);
  };

  function createClock(prefix, target){
    return {
      target: target,
      hours: new FlipUnit(document.getElementById('hoursDigits-' + prefix), 2),
      minutes: new FlipUnit(document.getElementById('minutesDigits-' + prefix), 2),
      seconds: new FlipUnit(document.getElementById('secondsDigits-' + prefix), 2),
      daysEl: document.getElementById('daysValue-' + prefix),
      wrap: document.getElementById('countdownWrap-' + prefix),
      arrival: document.getElementById('arrival-' + prefix),
      lastDays: null,
      arrivalShown: false,
      lastCelebration: -1
    };
  }

  var clocks = {
    engagement: createClock('engagement', new Date(2026, 8, 20, 0, 0, 0)),
    marriage: createClock('marriage', new Date(2026, 11, 6, 0, 0, 0))
  };
  var activeEvent = 'engagement';

  function updateClock(clock, isActive){
    var now = new Date();
    var diff = clock.target.getTime() - now.getTime();
    if (diff <= 0){
      diff = 0;
      if (!clock.arrivalShown){
        clock.arrivalShown = true;
        clock.wrap.classList.add('fading');
        setTimeout(function(){
          clock.arrival.classList.add('show');
        }, 500);
      }
    }

    var totalSeconds = Math.floor(diff / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    var instant = !isActive;

    if (days !== clock.lastDays){
      if (clock.lastDays !== null && !reduceMotion && isActive){
        (function(el, value){
          el.classList.add('swap');
          setTimeout(function(){
            el.textContent = String(value);
            el.classList.remove('swap');
          }, 220);
        })(clock.daysEl, days);
      } else {
        clock.daysEl.textContent = String(days);
      }
      clock.lastDays = days;
    }
    clock.hours.set(hours, instant);
    clock.minutes.set(minutes, instant);
    clock.seconds.set(seconds, instant);

    if (isActive && !clock.arrivalShown && seconds === 0 && totalSeconds !== clock.lastCelebration){
      clock.lastCelebration = totalSeconds;
      triggerCelebration();
    }
  }

  function updateCountdowns(){
    updateClock(clocks.engagement, activeEvent === 'engagement');
    updateClock(clocks.marriage, activeEvent === 'marriage');
  }

  updateCountdowns();
  setInterval(updateCountdowns, 250);

  var EVENT_META = {
    engagement: {
      title: 'Our Promise Begins — September 20, 2026',
      footer: 'Counting every moment until we promise.'
    },
    marriage: {
      title: 'Our Forever Begins — December 6, 2026',
      footer: 'Counting every moment until forever.'
    }
  };

  function switchEvent(name){
    if (!clocks[name] || name === activeEvent) return;
    activeEvent = name;
    document.querySelectorAll('.event-tab').forEach(function(tab){
      var on = tab.getAttribute('data-event') === name;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.event-panel').forEach(function(panel){
      var on = panel.id === 'panel-' + name;
      panel.classList.toggle('active', on);
      if (on) panel.removeAttribute('hidden');
      else panel.setAttribute('hidden', '');
    });
    document.title = EVENT_META[name].title;
    document.getElementById('footerLine').textContent = EVENT_META[name].footer;
    updateCountdowns();
  }

  document.querySelectorAll('.event-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      switchEvent(tab.getAttribute('data-event'));
    });
  });

  /* ================= Celebration ================= */
  var burstEl = document.getElementById('lightBurst');
  function triggerCelebration(){
    if (reduceMotion) return;
    burstEl.classList.remove('pulse');
    void burstEl.offsetWidth;
    burstEl.classList.add('pulse');
    scene.spawnCelebrationParticles();
  }

  /* ================= Canvas scene ================= */
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;
  var mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  window.addEventListener('pointermove', function(e){
    mouse.tx = e.clientX / W;
    mouse.ty = e.clientY / H;
  }, { passive: true });

  function rand(a, b){ return a + Math.random() * (b - a); }

  var bokeh = [];
  var BOKEH_COLORS = ['rgba(201,161,90,0.16)', 'rgba(122,39,64,0.20)', 'rgba(233,207,156,0.12)'];
  for (var i = 0; i < 6; i++){
    bokeh.push({
      x: rand(0, 1), y: rand(0, 1),
      r: rand(120, 260),
      vx: rand(-0.0025, 0.0025), vy: rand(-0.0015, 0.0015),
      color: BOKEH_COLORS[i % BOKEH_COLORS.length],
      depth: rand(0.02, 0.06)
    });
  }

  var dust = [];
  var DUST_COUNT = window.innerWidth < 640 ? 26 : 46;
  for (var d = 0; d < DUST_COUNT; d++){
    dust.push(makeDust());
  }
  function makeDust(){
    return {
      x: rand(0, 1), y: rand(0, 1),
      r: rand(0.6, 2.2),
      vy: rand(-0.00028, -0.00008),
      vx: rand(-0.00008, 0.00008),
      alpha: rand(0.15, 0.75),
      twinkle: rand(0, Math.PI * 2),
      depth: rand(0.01, 0.03)
    };
  }

  var petals = [];
  function spawnPetal(){
    if (petals.length > 7) return;
    petals.push({
      x: rand(0.05, 0.95), y: -0.05,
      vy: rand(0.00035, 0.0006),
      vx: rand(-0.00012, 0.00012),
      rot: rand(0, Math.PI * 2),
      vr: rand(-0.01, 0.01),
      size: rand(7, 13),
      sway: rand(0, Math.PI * 2),
      alpha: rand(0.35, 0.7)
    });
  }
  setInterval(function(){
    if (!reduceMotion && Math.random() < 0.6) spawnPetal();
  }, 4200);

  var burstParticles = [];
  function spawnCelebrationParticles(){
    for (var i = 0; i < 22; i++){
      burstParticles.push({
        x: 0.5, y: 0.4,
        vx: rand(-0.0016, 0.0016),
        vy: rand(-0.0022, -0.0004),
        life: 1,
        decay: rand(0.006, 0.012),
        r: rand(1, 2.6)
      });
    }
    for (var j = 0; j < 3; j++) spawnPetal();
  }

  function drawBokeh(){
    for (var i = 0; i < bokeh.length; i++){
      var b = bokeh[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x < -0.2) b.x = 1.2; if (b.x > 1.2) b.x = -0.2;
      if (b.y < -0.2) b.y = 1.2; if (b.y > 1.2) b.y = -0.2;
      var px = b.x * W + (mouse.x - 0.5) * W * b.depth;
      var py = b.y * H + (mouse.y - 0.5) * H * b.depth;
      var g = ctx.createRadialGradient(px, py, 0, px, py, b.r);
      g.addColorStop(0, b.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawDust(t){
    for (var i = 0; i < dust.length; i++){
      var p = dust[i];
      p.y += p.vy; p.x += p.vx;
      if (p.y < -0.02){ dust[i] = makeDust(); dust[i].y = 1.02; continue; }
      var tw = 0.55 + 0.45 * Math.sin(t * 0.001 + p.twinkle);
      var px = p.x * W + (mouse.x - 0.5) * W * p.depth;
      var py = p.y * H + (mouse.y - 0.5) * H * p.depth;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(233,207,156,' + (p.alpha * tw).toFixed(3) + ')';
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPetals(){
    for (var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.sway) * 0.00006;
      p.sway += 0.02;
      p.rot += p.vr;
      if (p.y > 1.08){ petals.splice(i, 1); continue; }
      var px = p.x * W, py = p.y * H;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(p.rot);
      ctx.fillStyle = 'rgba(122,39,64,' + p.alpha.toFixed(2) + ')';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 0.55, p.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBurst(){
    for (var i = burstParticles.length - 1; i >= 0; i--){
      var p = burstParticles[i];
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0){ burstParticles.splice(i, 1); continue; }
      var px = p.x * W, py = p.y * H;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(233,207,156,' + (p.life * 0.8).toFixed(3) + ')';
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(t){
    ctx.clearRect(0, 0, W, H);
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;
    drawBokeh();
    drawDust(t || 0);
    drawPetals();
    drawBurst();
    requestAnimationFrame(frame);
  }

  if (reduceMotion){
    drawBokeh(); drawDust(0);
  } else {
    requestAnimationFrame(frame);
  }

  var scene = { spawnCelebrationParticles: spawnCelebrationParticles };

  /* ================= Entrance ================= */
  window.addEventListener('load', function(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.body.classList.add('ready');
      });
    });
  });

  /* ================= Ambient music toggle ================= */
  var musicBtn = document.getElementById('musicBtn');
  var audioCtx = null, gainNode = null, nodes = [], playing = false;

  function startAmbience(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    gainNode.connect(filter);
    filter.connect(audioCtx.destination);

    var freqs = [130.81, 164.81, 196.0, 261.63]; // soft C major pad
    nodes = freqs.map(function(f, idx){
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      var lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.05 + idx * 0.01;
      var lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 3;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      var oscGain = audioCtx.createGain();
      oscGain.gain.value = 0.16;
      osc.connect(oscGain);
      oscGain.connect(gainNode);
      osc.start();
      lfo.start();
      return { osc: osc, lfo: lfo };
    });

    gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2.2);
    playing = true;
    musicBtn.textContent = '🔊';
  }

  function stopAmbience(){
    if (gainNode && audioCtx){
      gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
      setTimeout(function(){
        nodes.forEach(function(n){ try{ n.osc.stop(); n.lfo.stop(); }catch(e){} });
        nodes = [];
      }, 1300);
    }
    playing = false;
    musicBtn.textContent = '🔇';
  }

  musicBtn.addEventListener('click', function(){
    if (playing) stopAmbience(); else startAmbience();
  });
})();
</script>
</body>
